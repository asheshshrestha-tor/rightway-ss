{% comment %}Mobile-only bar; on large screens the sidebar takes over.{% endcomment %}
<div id="kt_app_header" class="app-header d-flex d-lg-none"
     data-kt-sticky="true"
     data-kt-sticky-activate="{default: false, lg: true}"
     data-kt-sticky-name="app-header-sticky"
     data-kt-sticky-offset="{default: false, lg: '300px'}">
    <div class="app-container container-xxl d-flex align-items-center justify-content-between" id="kt_app_header_container">
        <div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0 me-lg-15">
            <a href="{% url 'dashboard:index' %}" class="d-flex align-items-center text-white">
                <span class="brand-mark brand-mark--sm d-flex flex-center me-3">RS</span>
                <span class="fw-bold fs-6">Rightway</span>
            </a>
        </div>
        <div class="d-flex align-items-center d-lg-none ms-2 me-n3" title="Show sidebar menu">
            <div class="btn btn-icon btn-color-white bg-white bg-opacity-0 bg-hover-opacity-10 w-35px h-35px" id="kt_app_sidebar_mobile_toggle">
                <i class="ki-outline ki-abstract-14 fs-1"></i>
            </div>
        </div>
    </div>
</div>
