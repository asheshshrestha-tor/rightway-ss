{% extends "dashboard/auth/base.html" %}

{% block title %}Password Changed{% endblock %}
{% block brand_text %}You can now sign in with your new password.{% endblock %}

{% block form %}
<div class="text-center">
    <span class="symbol symbol-70px mb-8">
        <span class="symbol-label bg-light-primary">
            <i class="ki-outline ki-shield-tick fs-2tx text-primary"></i>
        </span>
    </span>

    <h1 class="text-gray-900 fw-bolder mb-4">Password changed</h1>
    <p class="text-gray-500 fw-semibold fs-6 mb-10">
        Your password has been updated. You can sign in with it now.
    </p>

    <a href="{% url 'dashboard:login' %}" class="btn btn-primary">Sign in</a>
</div>
{% endblock %}
