{% comment %}
Confirmation to the person who submitted a form. Same table-and-inline-styles
constraints as notification.html - Gmail strips <style> blocks and Outlook
renders through Word's engine.

Deliberately has no dashboard button: this goes to a member of the public.
{% endcomment %}
<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ heading }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">

    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ paragraphs.0 }}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7; padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden;">

                    <tr>
                        <td style="background-color:#166534; padding:24px 32px;">
                            <p style="margin:0; color:#ffffff; font-size:18px; font-weight:600;">{{ heading }}</p>
                            <p style="margin:4px 0 0; color:#bbf7d0; font-size:13px;">{{ site.name }}</p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:28px 32px 8px;">
                            <p style="margin:0 0 16px; color:#111827; font-size:15px;">Hi {{ greeting }},</p>

                            {% for paragraph in paragraphs %}
                                <p style="margin:0 0 16px; color:#374151; font-size:15px; line-height:1.6;">{{ paragraph }}</p>
                            {% endfor %}

                            {% if rows %}
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 4px; background-color:#f9fafb; border-radius:6px;">
                                    {% for label, value in rows %}
                                        <tr>
                                            <td style="padding:10px 16px; color:#6b7280; font-size:13px; width:130px; vertical-align:top;">{{ label }}</td>
                                            <td style="padding:10px 16px; color:#111827; font-size:14px; vertical-align:top; white-space:pre-line;">{{ value }}</td>
                                        </tr>
                                    {% endfor %}
                                </table>
                            {% endif %}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:12px 32px 28px;">
                            <p style="margin:0; color:#374151; font-size:15px; line-height:1.6;">
                                Kind regards,<br>
                                <strong>{{ site.name }}</strong>
                            </p>
                        </td>
                    </tr>

                    <tr>
                        <td style="background-color:#f9fafb; padding:18px 32px; border-top:1px solid #eef0f3;">
                            <p style="margin:0; color:#6b7280; font-size:12px; line-height:1.6;">
                                {% if phone %}{{ phone }}{% endif %}{% if site.email %} &nbsp;&middot;&nbsp; {{ site.email }}{% endif %}<br>
                                {% if site.address %}{{ site.address }}{% endif %}
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
