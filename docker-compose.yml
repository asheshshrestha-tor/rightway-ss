services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 700m
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - private_media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 800m
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
      - media:/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
volumes:
  mysql_data:
  media:
  private_media:
  static: